services:
  - type: web
    name: testops-advisor
    runtime: node
    plan: free
    branch: main
    buildCommand: "npm run seed"
    startCommand: "npm start"
    healthCheckPath: /healthz
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
