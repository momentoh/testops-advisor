services:
  - type: web
    name: testops-advisor
    runtime: node
    plan: free
    branch: main
    buildCommand: "npm run seed"
    startCommand: "npm start"
    healthCheckPath: /healthz
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPO
        value: momentoh/testops-advisor
      - key: GITHUB_WORKFLOW_FILE
        value: ci.yml
      - key: GITHUB_BRANCH
        value: main
