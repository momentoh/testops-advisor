services:
  - type: web
    name: testops-advisor
    runtime: node
    plan: free
    branch: main
    # 시드 데이터 초기화는 서버 부팅 시(src/server.js) 자동으로 처리한다.
    # (DATABASE_URL이 설정된 경우 Postgres에서 최신 데이터를 먼저 복원한 뒤,
    # 그래도 비어있을 때만 시드하므로 빌드 시점에 별도로 seed를 실행하면 안 된다 -
    # 아직 Postgres 복원 전의 "빈 파일" 기준으로 시드가 실행되어 buildCommand와
    # 런타임 부팅이 서로 다른 시점에 두 번 seed를 시도하는 경쟁 상태가 생길 수 있다.)
    buildCommand: "npm install"
    startCommand: "npm start"
    healthCheckPath: /healthz
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPO
        value: momentoh/testops-advisor
      - key: GITHUB_WORKFLOW_FILE
        value: ci.yml
      - key: GITHUB_BRANCH
        value: main
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-5
      # (선택) 외부 Postgres(Supabase/Neon 등 무료 티어) 연결 문자열.
      # 설정하면 재배포/재시작으로 컨테이너 디스크가 초기화되어도 이력이 보존된다.
      # 미설정 시 기존처럼 파일 기반(data/db.json)으로만 동작한다.
      - key: DATABASE_URL
        sync: false
