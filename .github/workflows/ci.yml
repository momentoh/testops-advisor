name: TestOps CI Pipeline

# 배포/모니터링 단계 1순위 도구인 GitHub Actions를 이용해
# 단위테스트(Jest) -> 통합/E2E(Playwright) -> 성능테스트(k6) 를 순서대로 자동 실행하는 파이프라인.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  unit-test:
    name: "1. 단위 테스트 (Jest)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Jest
        run: npm install --no-save --package-lock=false jest
      - name: Run unit tests
        run: npx jest --ci --colors

  e2e-test:
    name: "2. 통합/E2E 테스트 (Playwright)"
    runs-on: ubuntu-latest
    needs: unit-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: npm install --no-save --package-lock=false @playwright/test
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run E2E tests
        run: npx playwright test
        env:
          CI: true
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  performance-test:
    name: "3. 성능 테스트 (k6)"
    runs-on: ubuntu-latest
    needs: e2e-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Start server
        run: |
          TESTOPS_DB_PATH=./data/perf-test-db.json PORT=3000 node src/server.js &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000/healthz > /dev/null; then
              echo "서버 준비 완료 (시도 ${i}회)"
              exit 0
            fi
            echo "서버 대기 중... (${i}/30)"
            sleep 1
          done
          echo "서버가 30초 내에 응답하지 않았습니다."
          exit 1
      - name: Install k6
        run: |
          curl -sL https://github.com/grafana/k6/releases/download/v0.51.0/k6-v0.51.0-linux-amd64.tar.gz | tar xz
          sudo mv k6-v0.51.0-linux-amd64/k6 /usr/local/bin/k6
      - name: Run k6 load test
        run: k6 run perf/load-test.js

  security-audit:
    name: "4. 보안 취약점 점검 (npm audit)"
    runs-on: ubuntu-latest
    needs: unit-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run npm audit
        run: npm audit --audit-level=high || true

  notify-deploy:
    name: "5. 배포 안내 (Render 자동 배포 트리거 확인)"
    runs-on: ubuntu-latest
    needs: [e2e-test, performance-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deploy notice
        run: |
          echo "모든 테스트를 통과했습니다. Render.com이 GitHub push를 감지해 자동으로 재배포합니다."
          echo "배포 상태는 https://dashboard.render.com 에서 확인하세요."
